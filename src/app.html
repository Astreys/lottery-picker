<!doctype html>
<html lang="en-CA">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f3" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171614" />

		<!-- The draw history is fetched from here on demand. -->
		<link rel="preconnect" href="https://www.lotto-8.com" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
